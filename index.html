<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CarterBlast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module">
    if (!('commandForElement' in HTMLButtonElement.prototype)) {
      import('https://esm.run/invokers-polyfill');
    }
  </script>
</head>
<body>
  <div class="app-shell">
    <!-- Top HUD: Minimalist Block Blast Style -->
    <header class="top-hud">
      <div class="hud-left">
        <div class="best-pill">
          <!-- Golden Crown Icon -->
          <svg class="crown-icon" width="16" height="16" viewBox="0 0 24 24" fill="#fbbf24">
            <path d="M2.5 19h19a1 1 0 0 1 .8 1.6l-1.3 1.7a1 1 0 0 1-.8.4H3.8a1 1 0 0 1-.8-.4l-1.3-1.7A1 1 0 0 1 2.5 19zm1.2-14.2a1 1 0 0 1 1.7-.5l3.8 4.2 4.1-7.2a1 1 0 0 1 1.7 0l4.1 7.2 3.8-4.2a1 1 0 0 1 1.7.5l1.4 10.2H2.3L3.7 4.8z"/>
          </svg>
          <span class="best-value" id="best-score">0</span>
        </div>
      </div>

      <div class="hud-center">
        <div class="score-display" id="current-score">0</div>
        <div class="combo-pill hidden" id="combo-badge">2 COMBO!</div>
      </div>

      <div class="hud-right">
        <button class="circle-btn" id="sound-toggle-btn" title="Toggle Sound" aria-label="Toggle Sound" aria-pressed="true">
          <svg id="sound-on-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          <svg id="sound-off-icon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>
        </button>
        <button class="circle-btn" id="restart-btn" title="Restart" aria-label="Restart">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="circle-btn" commandfor="settings-dialog" command="show-modal" title="Settings" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- Main 8x8 Playfield Grid -->
    <main class="playfield-area">
      <div class="board-frame" id="board-wrapper">
        <div class="board-grid" id="board-grid" role="grid" aria-label="8 by 8 Game Grid"></div>
        <div class="floating-feedback-layer" id="feedback-layer"></div>
      </div>
    </main>

    <!-- 3-Slot Piece Dock -->
    <section class="dock-area" id="piece-dock" aria-label="Block Pieces">
      <div class="dock-slot" data-slot="0"></div>
      <div class="dock-slot" data-slot="1"></div>
      <div class="dock-slot" data-slot="2"></div>
    </section>
  </div>

  <!-- Drag Proxy Element -->
  <div id="drag-proxy" class="drag-proxy hidden" aria-hidden="true"></div>

  <!-- Minimal Settings Dialog (Hidden cleanly behind gear icon) -->
  <dialog id="settings-dialog" class="clean-dialog">
    <div class="dialog-top">
      <h3>Options</h3>
      <button class="circle-btn small" commandfor="settings-dialog" command="close" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="dialog-content">
      <div class="setting-row">
        <span>Carter Photo</span>
      </div>
      <div class="photo-btn-group">
        <button class="btn-pill" id="preset-headset-btn" type="button">Headset Selfie</button>
        <button class="btn-pill" id="preset-yt-btn" type="button">Fedora & Lens</button>
      </div>
      <div class="setting-row upload-row">
        <label class="btn-pill outline" for="custom-img-input">
          Upload Custom Picture
        </label>
        <input type="file" id="custom-img-input" accept="image/*" class="sr-only">
      </div>
    </div>
  </dialog>

  <!-- Clean Game Over Dialog -->
  <dialog id="game-over-dialog" class="clean-dialog game-over-modal">
    <div class="game-over-content">
      <div class="game-over-title">NO MORE MOVES</div>
      
      <div class="game-over-score-wrap">
        <div class="game-over-score" id="final-score-val">0</div>
      </div>

      <div class="game-over-best-pill">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#fbbf24">
          <path d="M2.5 19h19a1 1 0 0 1 .8 1.6l-1.3 1.7a1 1 0 0 1-.8.4H3.8a1 1 0 0 1-.8-.4l-1.3-1.7A1 1 0 0 1 2.5 19zm1.2-14.2a1 1 0 0 1 1.7-.5l3.8 4.2 4.1-7.2a1 1 0 0 1 1.7 0l4.1 7.2 3.8-4.2a1 1 0 0 1 1.7.5l1.4 10.2H2.3L3.7 4.8z"/>
        </svg>
        <span>BEST <strong id="final-best-val">0</strong></span>
      </div>

      <button class="btn-play-again" id="play-again-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
